# Optimization (QCEC preprocessing) vs. simulation time from 100 to 10k base gates at
# each qubit count. Only the simulation checker runs, so every check splits cleanly into
# preprocessing_s (QCEC's circuit optimizations) and check_s (the simulation checker).
#
# On random non-Clifford circuits the DD-based simulation checker blows up at larger
# qubit counts, so it gets a 60 s timeout and auto-skip ends a series after 2 timeouts.
name = "gate-scaling"
repeats = 1
timeout = 60.0
warmup = true
skip_after_timeouts = 2

[generator]
qubits = [4, 8, 12, 16, 20]
gates = [100, 300, 1000, 3000, 10000]
pairs = 8
gate_set = "mixed"
angle_mode = "mixed"
prefix_fraction = 0.5
equivalent_fraction = 0.5
seed = 759

[strategies.simulation]
run_alternating_checker = false
run_construction_checker = false
run_simulation_checker = true
run_zx_checker = false
