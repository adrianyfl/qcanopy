# Checker comparison at a fixed medium size, across gate pools.
name = "strategies"
repeats = 3
timeout = 60.0
warmup = true

[generator]
qubits = 10
gates = 400
pairs = 32
gate_set = ["clifford", "clifford-t", "parameterized", "mixed"]
angle_mode = ["discrete", "continuous"]
prefix_fraction = 0.5
seed = 759

[strategies.default]

[strategies.sequential]   # QCEC defaults, but run checkers one after another
parallel = false

[strategies.alternating]
run_alternating_checker = true
run_construction_checker = false
run_simulation_checker = false
run_zx_checker = false

[strategies.construction]
run_alternating_checker = false
run_construction_checker = true
run_simulation_checker = false
run_zx_checker = false

[strategies.simulation]
run_alternating_checker = false
run_construction_checker = false
run_simulation_checker = true
run_zx_checker = false

[strategies.zx]
run_alternating_checker = false
run_construction_checker = false
run_simulation_checker = false
run_zx_checker = true
