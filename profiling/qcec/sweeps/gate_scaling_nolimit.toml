# gate_scaling.toml without timeouts, up to 32 qubits. Every check runs to completion or
# until the worker runs out of memory (recorded as an error: "worker died").
#
# timeout = 0 disables QCEC's cooperative timeout. hard_timeout must be set explicitly:
# the profiler's default is 1.5 * timeout + 10, which would kill every check after 10 s.
# At 24+ qubits the 16 parallel simulations of random circuits are expected to exhaust
# memory past small gate counts; run the container with a memory cap so only the worker dies.
# Once a qubit count runs out of memory at some gate count, every higher qubit count at that
# gate count is recorded as "skipped" (skip_higher_qubits_on_oom, on by default).
name = "gate-scaling-nolimit"
repeats = 1
timeout = 0.0
hard_timeout = inf
warmup = true

[generator]
qubits = [4, 8, 12, 16, 20, 24, 28, 32]
gates = [100, 300, 1000, 3000, 10000]
pairs = 4
gate_set = "mixed"
angle_mode = "mixed"
prefix_fraction = 0.5
equivalent_fraction = 0.5
seed = 759

[strategies.simulation]
run_alternating_checker = false
run_construction_checker = false
run_simulation_checker = true
run_zx_checker = false
